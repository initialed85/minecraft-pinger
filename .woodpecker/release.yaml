# The linux binaries the old GitHub Actions workflow published on a v* tag: amd64 and arm64, the
# arm64 one cross-compiled with the Debian aarch64 gcc (the same linker the workflow used).
#
# The release is built by the same workflow that publishes it, because the workspace PVC is per
# workflow (compiler.go:137 prefixes the volume with a per-workflow ULID), so a separate workflow would
# not see the artifacts.
# `when` has no tag-pattern filter (only `ref`, and for a tag event the ref is not a bare tag name), so the
# old workflow's `on.push.tags: v*` becomes an explicit guard: a tag that is not v* fails this pipeline
# loudly instead of quietly publishing a release nobody asked for.
steps:
  - name: guard-tag-name
    image: docker.io/library/rust:1.99.1
    commands:
      - case "$CI_COMMIT_TAG" in v*) echo "publishing release $CI_COMMIT_TAG" ;; *) echo "refusing to publish from tag $CI_COMMIT_TAG - this repo releases v* tags only"; exit 1 ;; esac

  - name: artifacts
    image: docker.io/library/rust:1.99.1
    depends_on: [guard-tag-name]
    commands:
      # The cross linker needs the target's C runtime objects (crti.o, Scrt1.o) as well as the compiler.
      # Debian puts them in libc6-dev-arm64-cross, which gcc-aarch64-linux-gnu only *Recommends*, and this
      # install runs with --no-install-recommends - the old Actions runner did not, which is why the same
      # two packages linked there and not here. minecraft-pinger #4 died at the aarch64 link with
      # "aarch64-linux-gnu/bin/ld: cannot find crti.o: No such file or directory" and the same for Scrt1.o,
      # after compiling every dependency. Name the dev package explicitly instead of dropping
      # --no-install-recommends: it is the third time this port has had to be told that the Actions runner
      # was a fatter image than the one CI uses (GNU vs BSD text tools being the other two).
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross >/dev/null
      - rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
      - mkdir -p stage
      - cargo build --release --target x86_64-unknown-linux-gnu
      - cp target/x86_64-unknown-linux-gnu/release/minecraft_pinger stage/minecraft_pinger-linux-amd64
      - CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc cargo build --release --target aarch64-unknown-linux-gnu
      - cp target/aarch64-unknown-linux-gnu/release/minecraft_pinger stage/minecraft_pinger-linux-arm64
      - ls -l stage

  - name: release
    image: docker.io/initialed85/wp-gh-release:latest
    depends_on: [artifacts]
    settings:
      files:
        - stage/minecraft_pinger-linux-amd64
        - stage/minecraft_pinger-linux-arm64
    backend_options:
      kubernetes:
        secrets:
          - name: github-token
            key: token
            target:
              env: PLUGIN_TOKEN

when:
  - event: tag
