name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: minecraft_pinger-linux-amd64
            cross_gcc: ""
          - target: aarch64-unknown-linux-gnu
            artifact: minecraft_pinger-linux-arm64
            cross_gcc: gcc-aarch64-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compiler
        if: matrix.cross_gcc != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.cross_gcc }}

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary
        run: |
          mkdir -p stage
          cp target/${{ matrix.target }}/release/minecraft_pinger stage/${{ matrix.artifact }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: stage/${{ matrix.artifact }}
