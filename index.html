<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>minecraft pinger</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #fff;
        color: #111;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 12px 8px 12px;
        height: 100%;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 4px;
        margin: 0 0 2px;
      }
      h1 {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
      }

      .summary {
        font-size: 13px;
        white-space: pre;
        margin: 0 0 8px;
        line-height: 1.3;
      }
      .summary .host {
        font-weight: 600;
      }
      .charts {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 240px;
      }
      .chart {
        position: relative;
        flex: 1 1 0;
        min-height: 100px;
        width: 100%;
      }
      .err {
        color: #b00;
        font-size: 12px;
        margin-top: 8px;
        min-height: 14px;
      }
      .stale {
        color: #999;
      }
      .controls {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .controls button {
        font-family: inherit;
        font-size: 12px;
        padding: 3px 7px;
        border: 1px solid #ccc;
        border-radius: 3px;
        background: #fff;
        cursor: pointer;
        color: #444;
      }
      .controls button.active {
        background: #111;
        color: #fff;
        border-color: #111;
      }
      .controls button:hover:not(.active) {
        background: #f0f0f0;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <h1>minecraft pinger</h1>
        <div class="controls" id="controls">
          <button data-tf="fit" class="active">fit</button>
          <button data-tf="60000">1m</button>
          <button data-tf="300000">5m</button>
          <button data-tf="900000">15m</button>
          <button data-tf="3600000">1h</button>
        </div>
      </div>
      <pre class="summary" id="summary">loading...</pre>
      <div class="charts">
        <div class="chart"><canvas id="connChart"></canvas></div>
        <div class="chart"><canvas id="latChart"></canvas></div>
      </div>
      <div class="err" id="err"></div>
    </div>

    <script>
      const endpoint = `${window.location.origin}/ping`;

      const xScaleBase = {
        type: "linear",
        ticks: {
          maxRotation: 0,
          autoSkip: true,
          maxTicksLimit: 8,
          callback: (val) => {
            const d = new Date(val);
            if (isNaN(d)) return "";
            return d.toLocaleTimeString(undefined, { hour12: false });
          },
        },
      };

      const tooltipBase = {
        callbacks: {
          title: (items) => {
            const d = new Date(items[0].parsed.x);
            return isNaN(d) ? "" : d.toLocaleString();
          },
        },
      };

      const connChart = new Chart(document.getElementById("connChart").getContext("2d"), {
        type: "line",
        data: {
          datasets: [
            {
              label: "connectivity",
              data: [],
              borderColor: "#16a34a",
              backgroundColor: "rgba(22, 163, 74, 0.10)",
              borderWidth: 1,
              pointRadius: 0,
              stepped: "before",
              fill: true,
            },
          ],
        },
        options: {
          animation: false,
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: "nearest", axis: "x", intersect: false },
          scales: {
            x: xScaleBase,
            y: {
              title: { display: true, text: "connectivity" },
              min: 0,
              max: 1.1,
              ticks: { stepSize: 1, callback: (v) => (v === 1 ? "up" : v === 0 ? "down" : "") },
            },
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              ...tooltipBase,
              label: (item) => `connectivity: ${item.parsed.y === 1 ? "up" : "down"}`,
            },
          },
        },
      });

      const latChart = new Chart(document.getElementById("latChart").getContext("2d"), {
        type: "line",
        data: {
          datasets: [
            {
              label: "latency (ms)",
              data: [],
              borderColor: "#2563eb",
              backgroundColor: "rgba(37, 99, 235, 0.12)",
              borderWidth: 1,
              pointRadius: 0,
              tension: 0.2,
              fill: true,
            },
          ],
        },
        options: {
          animation: false,
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: "nearest", axis: "x", intersect: false },
          scales: {
            x: xScaleBase,
            y: {
              title: { display: true, text: "ms" },
              min: 0,
              ticks: { stepSize: 20 },
            },
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              ...tooltipBase,
              label: (item) => `${item.parsed.y} ms`,
            },
          },
        },
      });

      const summaryEl = document.getElementById("summary");
      const errEl = document.getElementById("err");

      let timeframe = null;

      document.getElementById("controls").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-tf]");
        if (!btn) return;
        document.querySelectorAll("#controls button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        timeframe = btn.dataset.tf === "fit" ? null : Number(btn.dataset.tf);
      });

      function fmt(n) {
        return (Math.round(n * 1000) / 1000).toString();
      }

      function setXRange(minT, maxT, fallbackMin) {
        const xMin = minT !== null ? minT : fallbackMin !== null ? fallbackMin : Date.now() - 3_600_000;
        const xMax = maxT !== null ? maxT : Date.now();
        connChart.options.scales.x.min = xMin;
        connChart.options.scales.x.max = xMax;
        latChart.options.scales.x.min = xMin;
        latChart.options.scales.x.max = xMax;
      }

      async function tick() {
        try {
          const res = await fetch(endpoint, { cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();

          const host = data.host;
          const lat = data.latency || {};
          const conn = data.connectivity || {};
          const history = Array.isArray(data.history) ? data.history : [];

          const now = Date.now();
          const cutoff = timeframe ? now - timeframe : null;

          const latencyPts = [];
          const connPts = [];
          for (const h of history) {
            const t = Date.parse(h.timestamp);
            if (isNaN(t)) continue;
            if (cutoff !== null && t < cutoff) continue;
            latencyPts.push({ x: t, y: h.latency });
            connPts.push({ x: t, y: h.connectivity });
          }

          const upPct =
            history.length > 0 ? (history.filter((h) => h.connectivity === 1).length / history.length) * 100 : 0;

          summaryEl.classList.remove("stale");
          summaryEl.textContent =
            `${host}\n` +
            `latency: ${fmt(lat.min)} ms (min), ${fmt(lat.avg)} ms (avg), ${fmt(lat.max)} ms (max)\n` +
            `connectivity: ${fmt(conn.min)} / ${fmt(conn.avg)} / ${fmt(conn.max)} (min/avg/max) — ${upPct.toFixed(1)}% up`;

          connChart.data.datasets[0].data = connPts;
          latChart.data.datasets[0].data = latencyPts;

          const latMax = latencyPts.length ? Math.max(...latencyPts.map((p) => p.y)) : 0;
          const lat1100 = latMax > 100;
          latChart.options.scales.y.max = lat1100 ? 1100 : 110;
          latChart.options.scales.y.ticks.stepSize = lat1100 ? 200 : 20;

          let minT = null,
            maxT = null;
          if (latencyPts.length > 0) {
            minT = latencyPts[0].x;
            maxT = latencyPts[latencyPts.length - 1].x;
          }
          if (cutoff !== null) {
            setXRange(Math.min(cutoff, minT ?? now), now, cutoff);
          } else {
            setXRange(minT, maxT, null);
          }

          connChart.update("none");
          latChart.update("none");

          errEl.textContent = "";
        } catch (e) {
          summaryEl.classList.add("stale");
          errEl.textContent = "error: " + (e && e.message ? e.message : e);
        }
      }

      tick();
      setInterval(tick, 1_000);
    </script>
  </body>
</html>
