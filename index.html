<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>minecraft pinger</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #fff;
        color: #111;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 12px 8px 12px;
        height: 100%;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 4px;
        margin: 0 0 2px;
      }
      h1 {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
      }

      .summary {
        font-size: 13px;
        white-space: pre;
        margin: 0 0 4px;
        line-height: 1.3;
      }
      .summary .host {
        font-weight: 600;
      }
      .charts {
        flex: 1 1 auto;
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: repeat(4, minmax(0, 1fr));
        gap: 4px;
        min-height: 0;
      }
      .chart {
        position: relative;
        min-height: 0;
        width: 100%;
      }
      .err {
        color: #b00;
        font-size: 12px;
        margin-top: 4px;
        min-height: 0;
      }
      .stale {
        color: #999;
      }
      .controls {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .controls button {
        font-family: inherit;
        font-size: 12px;
        padding: 3px 7px;
        border: 1px solid #ccc;
        border-radius: 3px;
        background: #fff;
        cursor: pointer;
        color: #444;
      }
      .controls button.active {
        background: #111;
        color: #fff;
        border-color: #111;
      }
      .controls button:hover:not(.active) {
        background: #f0f0f0;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <h1>minecraft pinger</h1>
        <div class="controls" id="controls">
          <button data-tf="fit" class="active">fit</button>
          <button data-tf="60000">1m</button>
          <button data-tf="300000">5m</button>
          <button data-tf="900000">15m</button>
          <button data-tf="3600000">1h</button>
        </div>
      </div>
      <pre class="summary" id="summary">loading...</pre>
      <div class="charts">
        <div class="chart"><canvas id="mcConnChart"></canvas></div>
        <div class="chart"><canvas id="netConnChart"></canvas></div>
        <div class="chart"><canvas id="mcLatChart"></canvas></div>
        <div class="chart"><canvas id="netLatChart"></canvas></div>
      </div>
      <div class="err" id="err"></div>
    </div>

    <script>
      const wsBase = `${window.location.origin.replace(/^http/, "ws")}`;
      const mcWsUrl = `${wsBase}/ws-minecraft`;
      const netWsUrl = `${wsBase}/ws-network`;

      const timeTick = (val) => {
        const d = new Date(val);
        if (isNaN(d)) return "";
        return d.toLocaleTimeString(undefined, { hour12: false });
      };

      // reserve the same vertical space on every chart's x axis so the
      // timestamp row on the bottom chart doesn't make its plot area
      // shorter than the others. for hidden-tick charts we keep the
      // ticks rendered (so the layout math reserves space) but make the
      // text transparent so nothing is actually drawn.
      function makeXScale(showTicks) {
        return {
          type: "linear",
          ticks: {
            display: true,
            color: showTicks ? "#666" : "transparent",
            maxRotation: 0,
            autoSkip: true,
            maxTicksLimit: 8,
            callback: timeTick,
          },
        };
      }

      const tooltipBase = {
        callbacks: {
          title: (items) => {
            const d = new Date(items[0].parsed.x);
            return isNaN(d) ? "" : d.toLocaleString();
          },
        },
      };

      const MC_COLOR = "#16a34a";
      const MC_BG = "rgba(22, 163, 74, 0.10)";
      const NET_COLOR = "#ea580c";
      const NET_BG = "rgba(234, 88, 12, 0.10)";

      const Y_FONT = { family: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace", size: 12 };
      const pad4 = (s) => String(s).padStart(4, " ");

      const connScale = {
        title: { display: true, text: "connectivity" },
        min: 0,
        max: 1.1,
        ticks: {
          stepSize: 1,
          font: Y_FONT,
          callback: (v) => pad4(v),
        },
      };

      function makeConnChart(canvasId, label, color, bg, xScale) {
        return new Chart(document.getElementById(canvasId).getContext("2d"), {
          type: "line",
          data: {
            datasets: [
              {
                label,
                data: [],
                borderColor: color,
                backgroundColor: bg,
                borderWidth: 1,
                pointRadius: 0,
                stepped: "before",
                fill: true,
              },
            ],
          },
          options: {
            animation: false,
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: "nearest", axis: "x", intersect: false },
            scales: { x: xScale, y: connScale },
            plugins: {
              legend: { display: false },
              tooltip: {
                ...tooltipBase,
                label: (item) => `${label}: ${item.parsed.y === 1 ? "up" : "down"}`,
              },
            },
          },
        });
      }

      function makeLatChart(canvasId, label, color, bg, xScale) {
        return new Chart(document.getElementById(canvasId).getContext("2d"), {
          type: "line",
          data: {
            datasets: [
              {
                label,
                data: [],
                borderColor: color,
                backgroundColor: bg,
                borderWidth: 1,
                pointRadius: 0,
                tension: 0.2,
                fill: true,
              },
            ],
          },
          options: {
            animation: false,
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: "nearest", axis: "x", intersect: false },
            scales: {
              x: xScale,
              y: {
                title: { display: true, text: "ms" },
                min: 0,
                ticks: { stepSize: 20, font: Y_FONT, callback: (v) => pad4(v) },
              },
            },
            plugins: {
              legend: { display: false },
              tooltip: {
                ...tooltipBase,
                label: (item) => `${label}: ${item.parsed.y} ms`,
              },
            },
          },
        });
      }

      const hiddenX = makeXScale(false);
      const shownX = makeXScale(true);
      const charts = {
        mcConn: makeConnChart("mcConnChart", "minecraft conn", MC_COLOR, MC_BG, hiddenX),
        netConn: makeConnChart("netConnChart", "network conn", NET_COLOR, NET_BG, hiddenX),
        mcLat: makeLatChart("mcLatChart", "minecraft lat", MC_COLOR, MC_BG, hiddenX),
        netLat: makeLatChart("netLatChart", "network lat", NET_COLOR, NET_BG, shownX),
      };

      const summaryEl = document.getElementById("summary");
      const errEl = document.getElementById("err");

      let timeframe = null;

      document.getElementById("controls").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-tf]");
        if (!btn) return;
        document.querySelectorAll("#controls button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        timeframe = btn.dataset.tf === "fit" ? null : Number(btn.dataset.tf);
        render();
      });

      function fmt(n) {
        return (Math.round(n * 1000) / 1000).toString();
      }

      function setXRange(minT, maxT, fallbackMin) {
        const xMin = minT !== null ? minT : fallbackMin !== null ? fallbackMin : Date.now() - 3_600_000;
        const xMax = maxT !== null ? maxT : Date.now();
        for (const c of Object.values(charts)) {
          c.options.scales.x.min = xMin;
          c.options.scales.x.max = xMax;
        }
      }

      let host = "";
      const MAX_HISTORY = 14400;
      const mcBucket = { hist: [], label: "minecraft" };
      const netBucket = { hist: [], label: "network" };

      function processSeries(hist, cutoff) {
        const latPts = [];
        const connPts = [];
        let latMin = Infinity,
          latMaxAll = 0,
          latSum = 0;
        let connMin = Infinity,
          connMaxAll = 0,
          connSum = 0;
        let upCount = 0,
          count = 0,
          visLatMax = 0;

        for (const h of hist) {
          const t = Date.parse(h.timestamp);
          if (isNaN(t)) continue;
          count++;
          if (h.latency < latMin) latMin = h.latency;
          if (h.latency > latMaxAll) latMaxAll = h.latency;
          latSum += h.latency;
          if (h.connectivity < connMin) connMin = h.connectivity;
          if (h.connectivity > connMaxAll) connMaxAll = h.connectivity;
          connSum += h.connectivity;
          if (h.connectivity === 1) upCount++;
          if (cutoff !== null && t < cutoff) continue;
          if (h.latency > visLatMax) visLatMax = h.latency;
          latPts.push({ x: t, y: h.latency });
          connPts.push({ x: t, y: h.connectivity });
        }

        return {
          latPts,
          connPts,
          latMin: count ? latMin : 0,
          latAvg: count ? latSum / count : 0,
          latMax: count ? latMaxAll : 0,
          connMin: count ? connMin : 0,
          connAvg: count ? connSum / count : 0,
          connMax: count ? connMaxAll : 0,
          upPct: count ? (upCount / count) * 100 : 0,
          visLatMax,
          firstT: latPts.length ? latPts[0].x : null,
          lastT: latPts.length ? latPts[latPts.length - 1].x : null,
        };
      }

      function render() {
        const now = Date.now();
        const cutoff = timeframe ? now - timeframe : null;

        const mc = processSeries(mcBucket.hist, cutoff);
        const net = processSeries(netBucket.hist, cutoff);

        charts.mcConn.data.datasets[0].data = mc.connPts;
        charts.netConn.data.datasets[0].data = net.connPts;
        charts.mcLat.data.datasets[0].data = mc.latPts;
        charts.netLat.data.datasets[0].data = net.latPts;

        const sharedVisLatMax = Math.max(mc.visLatMax, net.visLatMax);
        const tall = sharedVisLatMax > 260;
        const latMax = tall ? 1100 : 260;
        const latStep = tall ? 200 : 20;
        charts.mcLat.options.scales.y.max = latMax;
        charts.mcLat.options.scales.y.ticks.stepSize = latStep;
        charts.netLat.options.scales.y.max = latMax;
        charts.netLat.options.scales.y.ticks.stepSize = latStep;

        let minT = null,
          maxT = null;
        for (const s of [mc, net]) {
          if (s.firstT === null) continue;
          minT = minT === null ? s.firstT : Math.min(minT, s.firstT);
          maxT = maxT === null ? s.lastT : Math.max(maxT, s.lastT);
        }
        if (cutoff !== null) {
          setXRange(Math.min(cutoff, minT ?? now), now, cutoff);
        } else {
          setXRange(minT, maxT, null);
        }

        const line = (label, s) =>
          `${label.padEnd(9)} latency ${fmt(s.latMin)}/${fmt(s.latAvg)}/${fmt(s.latMax)} (min/avg/max) | conn ${fmt(s.connMin)}/${fmt(s.connAvg)}/${fmt(s.connMax)} — ${s.upPct.toFixed(1)}% up`;

        summaryEl.classList.remove("stale");
        summaryEl.textContent = `${host}\n` + line("minecraft", mc) + "\n" + line("network", net);

        for (const c of Object.values(charts)) c.update("none");
      }

      function connectSeries(url, bucket) {
        const ws = new WebSocket(url);

        ws.onmessage = (ev) => {
          let msg;
          try {
            msg = JSON.parse(ev.data);
          } catch {
            return;
          }
          if (msg.type === "snapshot") {
            if (msg.host) host = msg.host;
            bucket.hist = Array.isArray(msg.history) ? msg.history : [];
            render();
            errEl.textContent = "";
          } else if (msg.type === "ping") {
            bucket.hist.push({
              timestamp: msg.timestamp,
              connectivity: msg.connectivity,
              latency: msg.latency,
            });
            if (bucket.hist.length > MAX_HISTORY + 1000) {
              bucket.hist.splice(0, bucket.hist.length - MAX_HISTORY);
            }
            render();
          }
        };

        ws.onclose = () => {
          summaryEl.classList.add("stale");
          errEl.textContent = `${bucket.label} disconnected, reconnecting...`;
          setTimeout(() => connectSeries(url, bucket), 1_000);
        };

        ws.onerror = () => {
          ws.close();
        };
      }

      connectSeries(mcWsUrl, mcBucket);
      connectSeries(netWsUrl, netBucket);
    </script>
  </body>
</html>
